<!DOCTYPE html>
<html>
<head>
    <title>Simple Monitor</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f4; }
        .task-card { background: white; padding: 15px; margin-bottom: 10px; border-radius: 5px; display: flex; justify-content: space-between; }
        .up { color: green; font-weight: bold; }
        .down { color: red; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Task List</h1>
    <div id="add-task">
        <input id="name" placeholder="Task Name">
        <input id="url" placeholder="URL (https://...)">
        <input id="interval" placeholder="Cron(*/5 * * * *)">
        <button onclick="addTask()">ADD</button>
    </div>
    <hr>
    <div id="task-list"></div>

    <script>
        let globalAuthToken = "";
        async function init() {
            try {
                const res = await fetch('/api/config');
                const config = await res.json();
                globalAuthToken = config.authToken;
                fetchTasks();
            } catch (err) {
                console.error("fetch config err", err);
            }
        }
        
        async function fetchTasks() {
            const res = await fetch('/api/tasks', { headers: { 'Authorization': 'Basic ' + globalAuthToken } });
            const tasks = await res.json();
            const list = document.getElementById('task-list');
            list.innerHTML = tasks.map(t => `
                <div class="task-card" style="border-bottom: 1px solid #ccc; padding: 10px;">
                    <div style="display: flex; justify-content: space-between;">
                        <strong>${t.name}</strong>
                        <span class="${t.status === 'up' ? 'green' : 'red'}">${t.status.toUpperCase()}</span>
                    </div>
                    <small>${t.url}</small><br>
                    <small>ReTime: ${t.responseTime}ms | StCode: ${t.lastStatusCode || '-'}</small>
                    <small>Time： ${t.lastCheck || '-'}</small>
                    ${t.screenshot ? `
                        <div style="margin-top: 10px;">
                            <a href="${t.screenshot}" target="_blank">
                                <img src="${t.screenshot}" style="width: 200px; border: 1px solid #999; cursor: pointer;" 
                                     onerror="this.style.display='none'">
                            </a>
                            <br>
                            <a href="${t.screenshot}" target="_blank">View</a>
                        </div>
                    ` : ''}
                    
                    <button onclick="deleteTask('${t.id}')" style="margin-top: 5px;">Delete</button>
                </div>
            `).join('');
        }

        async function addTask() {
            const body = {
                name: document.getElementById('name').value,
                url: document.getElementById('url').value,
                interval: document.getElementById('interval').value
            };
            await fetch('/api/tasks', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': 'Basic ' + globalAuthToken 
                },
                body: JSON.stringify(body)
            });
            fetchTasks();
        }

        async function deleteTask(id) {
            await fetch(`/api/tasks/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': 'Basic ' + globalAuthToken }
            });
            fetchTasks();
        }
        init();
        setInterval(fetchTasks, 5000); 
    </script>
</body>
</html>
